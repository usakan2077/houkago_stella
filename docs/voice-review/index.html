<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>デバッグ報告11 — ボイス聴き比べ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101725;color:#eef3ff}body{max-width:1020px;margin:40px auto;padding:0 20px}h1{font-size:28px}p{line-height:1.8;color:#bdc9dd}a{color:#9bcaff}.toolbar{position:sticky;top:0;background:#101725f5;padding:15px 0;display:flex;gap:12px;flex-wrap:wrap;z-index:2}input,select,button{font:inherit;padding:10px;border:1px solid #4b5b75;border-radius:8px;background:#202e45;color:inherit}input[type=search]{flex:1;min-width:180px}article{padding:22px;margin:18px 0;border:1px solid #3c4a63;border-radius:12px;background:#182237}h2{font-size:17px;margin:0 0 12px}.identity{font-size:12px;color:#9eafc9;overflow-wrap:anywhere}.text{font-size:20px;color:#fff}.tts{font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer}button[aria-pressed=true]{background:#2566a3}.flag{color:#ffd391}label{display:flex;align-items:center;gap:8px}#status{min-height:1.6em}small{color:#bdc9dd}
</style>
<body>
<a href="../../index.html">← ゲーム</a> · <a href="../scenario-reference/index.html">本文・音声索引</a>
<h1>撮り直した23台詞を聴き比べる</h1>
<p>日本語21台詞・英語2台詞。再生時にはゲームと同じgainDbを適用します。旧音声も保存しています。発音、演技、語尾の聞こえ方を確認してください。自動検査で発音の正しさを判定したものではありません。</p>
<div class="toolbar"><select id="language" aria-label="言語"><option value="">日英すべて</option value="ja">日本語</option><option value="en">英語</option></select><select id="character" aria-label="人物"><option value="">全員</option><option>sakura</option><option>kotoha</option><option>mahiru</option><option>teacher_male</option></select><input id="search" type="search" placeholder="本文・台詞IDを検索" aria-label="本文・台詞IDを検索"><button id="stop">停止</button><label>音量<input id="volume" type="range" min="0" max="1" step=".05" value=".8"></label></div>
<p id="status" role="status" aria-live="polite">読み込み中…</p><main id="clips"></main>
<script>
let context,source,gain,playingButton,currentClip,token=0,rows=[];
const $=s=>document.querySelector(s);
function stop(){token++;if(source){try{source.stop()}catch{}source=null}if(playingButton)playingButton.setAttribute('aria-pressed','false');playingButton=null;currentClip=null}
async function play(clip,button,label){stop();const request=token;context??=new AudioContext();await context.resume();$('#status').textContent=label+'を読み込み中…';try{const response=await fetch('../../'+clip.src);if(!response.ok)throw new Error('HTTP '+response.status);const buffer=await context.decodeAudioData(await response.arrayBuffer());if(request!==token)return;source=context.createBufferSource();gain=context.createGain();source.buffer=buffer;gain.gain.value=10**(clip.gainDb/20)*Number($('#volume').value);source.connect(gain).connect(context.destination);playingButton=button;currentClip=clip;button.setAttribute('aria-pressed','true');source.onended=()=>{if(request===token){stop();$('#status').textContent='再生終了'}};source.start();$('#status').textContent=label+'を再生中'}catch(error){$('#status').textContent='再生できませんでした: '+error.message}}
function element(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function render(){stop();const q=$('#search').value.toLowerCase(),language=$('#language').value,character=$('#character').value;const shown=rows.filter(r=>(!language||r.language===language)&&(!character||r.character===character)&&[r.id,r.display,r.tts].join(' ').toLowerCase().includes(q));$('#clips').replaceChildren();shown.forEach(r=>{const card=element('article');card.append(element('h2',(r.language==='ja'?'日本語':'英語')+' · '+r.character),element('div',r.id,'identity'),element('p',r.display,'text'),element('p','読み上げ台本: '+r.tts,'tts'));const actions=element('div',null,'actions');for(const [key,label] of [['before','旧音声'],['after','撮り直し']]){const b=element('button',label);b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>play(r[key],b,label+' / '+r.character);actions.append(b)}card.append(actions,element('p','旧 '+r.old_duration.toFixed(2)+'秒 → 新 '+r.duration.toFixed(2)+'秒 / 新gain '+r.after.gainDb+' dB','identity'));if(r.needs_tail_listening)card.append(element('p','語尾付近の無音が短い音声です。最後の音まで聞こえるか確認してください。','flag'));$('#clips').append(card)});$('#status').textContent=shown.length+'台詞を表示'}
$('#stop').onclick=()=>{stop();$('#status').textContent='停止しました'};for(const id of ['language','character','search'])$('#'+id).addEventListener('input',render);$('#volume').addEventListener('input',()=>{if(gain&&currentClip)gain.gain.value=10**(currentClip.gainDb/20)*Number($('#volume').value)});fetch('clips.json').then(r=>r.json()).then(data=>{rows=data.clips;render()}).catch(e=>$('#status').textContent='一覧を読み込めません: '+e.message);window.addEventListener('pagehide',stop);
</script>
</body></html>
