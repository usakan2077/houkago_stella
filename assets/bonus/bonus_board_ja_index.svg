<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><title>文化祭用の架空VIP板スレッド一覧</title><rect x="0" y="0" width="1200" height="470" fill="#efefef" stroke="none"/><defs><pattern id="brick" width="90" height="32" patternUnits="userSpaceOnUse"><rect width="90" height="32" fill="#d8c5ad"/><path d="M0 0H90M0 16H90M45 0V16M0 16V32M90 16V32" stroke="#f4eadc"/></pattern></defs><rect x="0" y="0" width="1200" height="86" fill="url(#brick)" stroke="none"/><rect x="350" y="9" width="500" height="65" fill="#fff" stroke="#45458a"/><text x="370" y="32" font-family="MS PGothic, Meiryo, sans-serif" font-size="23" fill="#5254a0" font-weight="bold">文化祭実行委員 募集 !!</text><text x="370" y="56" font-family="MS PGothic, Meiryo, sans-serif" font-size="15" fill="#5254a0">※ノルマはありません　※出し物はまだ決まっていません</text><rect x="7" y="92" width="1186" height="122" fill="#ccffcc" stroke="#0000cc"/><text x="20" y="116" font-family="MS PGothic, Meiryo, sans-serif" font-size="18" fill="#0000cc" text-decoration="underline">ニュース速報(VIP)＠２ちゃんねる</text><text x="20" y="148" font-family="MS PGothic, Meiryo, sans-serif" font-size="29" fill="#000066" font-weight="bold">特別な板、ニュー速VIPへようこそ</text><text x="20" y="178" font-family="MS PGothic, Meiryo, sans-serif" font-size="17" fill="#0000cc" text-decoration="underline">■掲示板一覧　■スレッド一覧　■新規スレッド作成　■リロード</text><text x="20" y="201" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">書き込む前に読んでね ｜ ２ちゃんねるガイド</text><text x="20" y="241" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">1: 曙「残像だ」 (82)</text><text x="20" y="267" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">2: 俺の車がボーナスステージで壊されていた (164)</text><text x="20" y="293" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">3: マーメイドのマーってなんだ？ (31)</text><text x="20" y="319" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">4: シーフードドリアのシーフーってなんだ？ (53)</text><text x="20" y="345" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">5: 全ての罪深き人々に神の裁きを。歌丸です。 (120)</text><text x="20" y="371" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">6: だけどﾅﾑｱﾐﾀﾞが出ちゃう。住職だもん (76)</text><text x="20" y="397" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">7: ごはんですよはごはんじゃないですよ (98)</text><text x="20" y="423" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">8: パンはパンでも奴はとんでもないものをルパンルパーン (82)</text><text x="612" y="241" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">9: さーてライジングサザエさんはー？ (164)</text><text x="612" y="267" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">10: ユニクロ店員「さっそく装備していくかい？」 (31)</text><text x="612" y="293" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">11: フネ「お父さんそれは残像ですよ」 (53)</text><text x="612" y="319" font-family="MS PGothic, Meiryo, sans-serif" font-size="14" fill="#0000cc" text-decoration="underline">12: 立てば芍薬、座れば牡丹、歩く姿はｶﾘﾌﾗﾜ――(ﾟ∀ﾟ)――!!!! (120)</text><text x="612" y="345" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">13: しずか「キャー！のび太ｻﾝﾄﾞｳｨｯｼﾞ！」 (76)</text><text x="612" y="371" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">14: 萌える絵の描き方教えてくれ (17)</text><text x="612" y="397" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">15: しょこたんと愉快な仲間たちパートスレ (24)</text><text x="612" y="423" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#b00000" text-decoration="underline">16: 【急募】文化祭の出し物が決まらない件 (98)</text><text x="20" y="459" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">全部読む　最新50　1-100　掲示板に戻る　スレッドを立てる</text></svg>
