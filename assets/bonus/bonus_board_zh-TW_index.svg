<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><title>文化祭用の架空VIP板スレッド一覧</title><rect x="0" y="0" width="1200" height="470" fill="#efefef" stroke="none"/><defs><pattern id="brick" width="90" height="32" patternUnits="userSpaceOnUse"><rect width="90" height="32" fill="#d8c5ad"/><path d="M0 0H90M0 16H90M45 0V16M0 16V32M90 16V32" stroke="#f4eadc"/></pattern></defs><rect x="0" y="0" width="1200" height="86" fill="url(#brick)" stroke="none"/><rect x="350" y="9" width="500" height="65" fill="#fff" stroke="#45458a"/><text x="370" y="32" font-family="MS PGothic, Meiryo, sans-serif" font-size="23" fill="#5254a0" font-weight="bold">文化祭執行委員 招募中！！</text><text x="370" y="56" font-family="MS PGothic, Meiryo, sans-serif" font-size="15" fill="#5254a0">※沒有指標要求　※活動內容仍未決定</text><rect x="7" y="92" width="1186" height="122" fill="#ccffcc" stroke="#0000cc"/><text x="20" y="116" font-family="MS PGothic, Meiryo, sans-serif" font-size="18" fill="#0000cc" text-decoration="underline">新聞速報（VIP）＠2ch</text><text x="20" y="148" font-family="MS PGothic, Meiryo, sans-serif" font-size="29" fill="#000066" font-weight="bold">歡迎來到特別版面：新聞速報VIP</text><text x="20" y="178" font-family="MS PGothic, Meiryo, sans-serif" font-size="17" fill="#0000cc" text-decoration="underline">■版面列表　■帖子列表　■發表新帖　■刷新</text><text x="20" y="201" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">發帖前請先閱讀｜2ch指南</text><text x="20" y="241" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">1：曙“那只是殘影”（82）</text><text x="20" y="267" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">2：我的車在獎勵關里被砸了（164）</text><text x="20" y="293" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">3：美人魚的美，是哪種美？（31）</text><text x="20" y="319" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">4：海鮮焗飯的海鮮，是海里的仙人嗎？（53）</text><text x="20" y="345" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">5：愿神審判所有有罪之人。我是歌丸。（120）</text><text x="20" y="371" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">6：可是南無阿彌陀佛還是脫口而出。因為是住持嘛。（76）</text><text x="20" y="397" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">7：“開飯啦”其實不是飯哦（98）</text><text x="20" y="423" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">8：面包是面包，他卻偷走了不得了的東西，魯邦魯邦——（82）</text><text x="612" y="241" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">9：那么，下一集的旭日海螺小姐是——？（164）</text><text x="612" y="267" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">10：優衣庫店員“要現在就裝備上嗎？”（31）</text><text x="612" y="293" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">11：舟“爸爸，那只是殘影哦”（53）</text><text x="612" y="319" font-family="MS PGothic, Meiryo, sans-serif" font-size="14" fill="#0000cc" text-decoration="underline">12：站如芍藥，坐如牡丹，走起路來花椰菜——(ﾟ∀ﾟ)——！！（120）</text><text x="612" y="345" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">13：靜香“呀！大雄三明治！”（76）</text><text x="612" y="371" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">14：求教怎么畫萌圖（17）</text><text x="612" y="397" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">15：翔子和愉快的伙伴們長期連載帖（24）</text><text x="612" y="423" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#b00000" text-decoration="underline">16：【急】文化祭活動還沒決定怎么辦（98）</text><text x="20" y="459" font-family="MS PGothic, Meiryo, sans-serif" font-size="16" fill="#0000cc" text-decoration="underline">閱讀全部　最新50條　1—100　返回版面　發表新帖</text></svg>
