><text x="112" y="270" font-family="Times New Roman, serif" font-size="17" fill="#800000">&gt;&gt;1002  pics or it didn&#x27;t happen</text><text x="18" y="297" font-family="Times New Roman, serif" font-size="18" fill="#117743" font-weight="bold">Badger loop still going   Anonymous   No.1003   [Reply]</text><rect x="20" y="306" width="70" height="47" fill="#dad1b5" stroke="#b7a7a3"/><text x="27" y="334" font-family="MS PGothic, Meiryo, sans-serif" font-size="15" fill="#806848">LOOP</text><text x="104" y="322" font-family="Times New Roman, serif" font-size="18" fill="#800000">I have been waiting for this to end since lunch.</text><rect x="101" y="331" width="1078" height="28" fill="#f0e0d6" stroke="none"/><text x="112" y="351" font-family="Times New Roman, serif" font-size="17" fill="#800000">&gt;&gt;1003  The snake will be back.</text><text x="18" y="378" font-family="Times New Roman, serif" font-size="18" fill="#117743" font-weight="bold">You are the man now, dog   Anonymous   No.1004   [Reply]</text><rect x="20" y="387" width="70" height="47" fill="#dad1b5" stroke="#b7a7a3"/><text x="27" y="415" font-family="MS PGothic, Meiryo, sans-serif" font-size="15" fill="#806848">CAT</text><text x="104" y="403" font-family="Times New Roman, serif" font-size="18" fill="#800000">Post your ancient bookmarks.</text><rect x="101" y="412" width="1078" height="28" fill="#f0e0d6" stroke="none"/><text x="112" y="432" font-family="Times New Roman, serif" font-size="17" fill="#800000">&gt;&gt;1004  This thread needs more cats.</text></svg>
